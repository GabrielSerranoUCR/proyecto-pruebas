[project]
name = "proyecto-pruebas"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "GabrielSerranoUCR", email = "gabriel.serranorojas@ucr.ac.cr" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.146.0",
    "jinja2>=3.1.6",
    "joblib>=1.6.0",
    "pandas>=3.0.6",
    "python-dotenv>=1.2.3",
    "scikit-learn>=1.9.0",
    "scipy>=1.18.1",
    "supabase>=2.31.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
proyecto-pruebas = "proyecto_pruebas.main:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pylint>=4.0.8",
    "pytest>=9.1.1",
]
jupyter = [
    "ipykernel>=7.4.0",
    "joblib>=1.6.0",
    "jupyterlab>=4.6.4",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "scikit-learn>=1.9.0",
    "seaborn>=0.13.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
