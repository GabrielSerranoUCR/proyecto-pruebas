name: Test Suite

on:
  push:
    branches: [main, dev, "feature/**", "fix/**"]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.9"

      - name: Install dependencies
        run: uv sync --group jupyter

      - name: Train and generate ML model artifacts
        run: |
          uv run python training/train_m02.py
          uv run python training/notebooks/m03_riesgo_morosidad/entrenamiento.py
          cd training/notebooks
          uv run jupyter nbconvert --to notebook --execute --output-dir /tmp Aprobacion_de_curso_training_model.ipynb

      - name: Run automated test suite with coverage
        run: |
          uv run pytest -v --cov=src/proyecto_pruebas --cov-report=term-missing --cov-report=xml:coverage.xml

      - name: Install Playwright browser
        run: uv run playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: |
          uv run pytest --e2e tests/e2e -v \
            --html=test-results/reporte-e2e.html --self-contained-html \
            --tracing=retain-on-failure \
            --video=retain-on-failure \
            --screenshot=only-on-failure \
            --output=test-results/playwright

      - name: Upload E2E report and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-e2e
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14
